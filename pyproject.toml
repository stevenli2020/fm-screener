[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-market-sgx"
version = "0.1.0"
description = "Auditable SGX screening and research workflow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]
server = [
  "fastapi>=0.123,<1",
  "numpy>=2.1,<3",
  "pandas>=2.2,<4",
  "pydantic>=2.12,<3",
  "protobuf>=5.29,<8",
  "uvicorn>=0.38,<1",
  "yfinance>=0.2.66,<0.3",
]

[project.scripts]
fm = "financial_market.cli:main"
fm-data-server = "financial_market.data_server.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
financial_market = ["db/*.sql"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --basetemp=.pytest-tmp"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["FriesTrader", "mcp_server.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
